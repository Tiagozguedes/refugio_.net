# Na VM, junto com o docker-compose.yml da raiz:
#   docker compose -f docker-compose.yml -f scripts/vm/docker-compose.vm.yml up -d --build
#
# O Caddy recebe 80/443, obtém o certificado HTTPS (Let's Encrypt) para o DOMINIO e repassa para a API.
# A porta 8080 da API não é aberta na rede da VM: o acesso externo é só por HTTPS.

services:
  api:
    ports: !override []
    environment:
      # Atrás do Caddy: a API lê o IP real do cliente no X-Forwarded-For. Seguro porque a 8080
      # não é exposta e só o Caddy alcança a API.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

  caddy:
    image: caddy:2-alpine
    container_name: refugio-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMINIO: "${DOMINIO:?Defina DOMINIO no .env, por exemplo refugio-api.brazilsouth.cloudapp.azure.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
